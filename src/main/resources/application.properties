# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# Cambiamos el puerto por defecto (8080) al 8081
server.port=8081

# ===============================
# CONEXIÓN A LA BASE DE DATOS (MySQL - XAMPP)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/foro_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===============================
# Actualiza las tablas automáticamente según tus entidades de Java
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (muy útil para depurar)
spring.jpa.show-sql=true

# Da un formato legible a las consultas SQL en la consola
spring.jpa.properties.hibernate.format_sql=true