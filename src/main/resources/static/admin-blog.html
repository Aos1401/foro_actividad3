<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor del Blog - Superadmin</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/blog.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="home.html" style="color:white; text-decoration:none;">← Volver al Foro</a></div>
  <div style="color: white; font-weight: bold;">📝 Publicar en el Blog</div>
</nav>

<div class="container blog-container">
  <div class="editor-card">
    <h2>Escribir Nuevo Artículo</h2>
    <br>
    <label class="editor-label">Título del artículo:</label>
    <input type="text" id="postTitle" class="editor-input" placeholder="Escribe un título llamativo...">

    <label class="editor-label">Contenido (Editor Rico):</label>
    <textarea id="editor"></textarea>

    <button id="publishBtn" class="btn-publish">🚀 Publicar Artículo</button>
  </div>
</div>

<script src="js/admin-blog.js"></script>
</body>
</html>
